name: Publish to npm

# Trusted Publishing (OIDC). Do not provide a long-lived npm publish token.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc

      - name: Update npm (11.5.1+ is required for OIDC)
        run: npm install -g npm@latest

      - run: npm ci

      - run: npm test

      - name: Publish to npm
        run: npm publish --provenance --access public
