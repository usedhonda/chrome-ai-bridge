name: Browser workflow checks

permissions:
  contents: read

# Logged-in ChatGPT/Gemini are exercised by the calling agent, not a GitHub runner.
# See docs/user/workflows.md for the manual native-browser acceptance checklist.
on:
  workflow_dispatch:

jobs:
  browser-workflow:
    name: Deterministic browser workflow integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          cache: npm
          node-version-file: .nvmrc
      - run: npm ci
      - run: npm run test:browser-use
      - name: Explain validation scope
        run: |
          echo "Validated CLI/state/prompt/PR-verification behavior without live provider sessions." >> "$GITHUB_STEP_SUMMARY"
          echo "Authenticated browser acceptance is documented in docs/user/workflows.md." >> "$GITHUB_STEP_SUMMARY"
